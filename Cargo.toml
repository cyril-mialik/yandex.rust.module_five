[package]
name = "broken-app"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[profile.bench]
opt-level = 3
lto = true

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bin]]
name = "baseline"
path = "benches/baseline.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "criterion"
harness = false
